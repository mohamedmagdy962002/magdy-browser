name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macOS runner: the only place an iOS app can actually be compiled.
    # Free plan: public repos unlimited, private repos get a small monthly minute allowance.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project MagdyBrowser.xcodeproj \
            -scheme MagdyBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          python3 scripts/make_unsigned_ipa.py \
            build/DerivedData/Build/Products/Release-iphoneos/MagdyBrowser.app \
            build/MagdyBrowser-unsigned.ipa
          unzip -l build/MagdyBrowser-unsigned.ipa | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagdyBrowser-ipa
          path: build/MagdyBrowser-unsigned.ipa
          if-no-files-found: error

  simulator:
    # Online runtime: boots an iOS Simulator, launches the app, taps through
    # the main screens and uploads real screenshots for inspection.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run UI screenshot tests
        run: |
          # Pick whatever iPhone simulator this runner image ships.
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | awk -F'[()]' '{print $2}')
          echo "Simulator UDID: $UDID"
          xcodebuild test \
            -project MagdyBrowser.xcodeproj \
            -scheme Screenshots \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/TestData \
            CODE_SIGNING_ALLOWED=NO
        env:
          SHOT_DIR: ${{ github.workspace }}/build/shots

      - name: Collect screenshots
        if: always()
        run: ls -la build/shots || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: build/shots
          if-no-files-found: warn
