name: MagdyBrowser

options:
  bundleIdPrefix: com.magdy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "52"
    MARKETING_VERSION: "2.28"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MagdyBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Extensions
      - path: Resources
        excludes:
          - Info.plist
          - Wallpapers
          - filters
          - Fonts
          - blocklist_full.json
      - path: Resources/Wallpapers
        type: folder
      - path: Resources/filters
        type: folder
      - path: Resources/Fonts
        type: folder
    dependencies:
      - target: MagdyWidget
        embed: true
      - target: MagdyShare
        embed: true
      - target: MagdyAction
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Magdy
        CFBundleName: Magdy Browser
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, fr, es, de, tr]
        CFBundleShortVersionString: "2.28"
        CFBundleVersion: "52"
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.magdy.browser.url
            CFBundleURLSchemes:
              - magdy
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Magdy Browser uses Face ID to protect the app lock and your Private Vault.
        NSCameraUsageDescription: Magdy Browser needs the camera for QR code scanning and websites that request it.
        NSMicrophoneUsageDescription: Magdy Browser needs the microphone for voice search and websites that request it.
        NSSpeechRecognitionUsageDescription: Magdy Browser uses speech recognition to turn your voice into search queries.
        NSPhotoLibraryAddUsageDescription: Magdy Browser saves full-page screenshots to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MagdyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Widget
        excludes:
          - Info.plist
    info:
      path: Sources/Extensions/Widget/Info.plist
      properties:
        CFBundleDisplayName: Magdy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  MagdyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Share
        excludes:
          - Info.plist
      - path: Sources/Support/URLValidation.swift
    info:
      path: Sources/Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Open in Magdy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.share
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  MagdyAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Action
        excludes:
          - Info.plist
      - path: Sources/Support/URLValidation.swift
    info:
      path: Sources/Extensions/Action/Info.plist
      properties:
        CFBundleDisplayName: Search in Magdy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.action
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  MagdyBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: MagdyBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.tests
        TEST_TARGET_NAME: MagdyBrowser
        GENERATE_INFOPLIST_FILE: YES

  MagdyBrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: MagdyBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.uitests
        TEST_TARGET_NAME: MagdyBrowser
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MagdyBrowser:
    build:
      targets:
        MagdyBrowser: all
  UnitTests:
    build:
      targets:
        MagdyBrowser: all
    test:
      config: Debug
      targets:
        - MagdyBrowserTests
  Screenshots:
    build:
      targets:
        MagdyBrowser: all
    test:
      config: Debug
      targets:
        - MagdyBrowserUITests
