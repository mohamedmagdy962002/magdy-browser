name: MagdyBrowser

options:
  bundleIdPrefix: com.magdy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "2.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MagdyBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Extensions
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - target: MagdyWidget
        embed: true
      - target: MagdyShare
        embed: true
      - target: MagdyAction
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Magdy
        CFBundleName: Magdy Browser
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.magdy.browser.url
            CFBundleURLSchemes:
              - magdy
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MagdyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Widget
        excludes:
          - Info.plist
    info:
      path: Sources/Extensions/Widget/Info.plist
      properties:
        CFBundleDisplayName: Magdy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  MagdyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Share
        excludes:
          - Info.plist
    info:
      path: Sources/Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Open in Magdy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.share
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  MagdyAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extensions/Action
        excludes:
          - Info.plist
    info:
      path: Sources/Extensions/Action/Info.plist
      properties:
        CFBundleDisplayName: Search in Magdy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdy.browser.action
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
